<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYBANK</title>
    <!-- 디자인 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- 로그인 & 진입 카드 박스 -->
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/80 text-center max-w-sm w-full">
        
        <!-- 1. 진입 전 메인 화면 -->
        <div id="entryView">
            <!-- 로고 및 서비스 설명 -->
            <div class="mb-8">
                <h1 class="text-3xl font-extrabold text-sky-700 tracking-tight mb-1">온리뱅크</h1>
                <p class="text-xs font-semibold text-slate-400 tracking-wider uppercase mb-3">ONLYBANK</p>
                <p class="text-slate-600 text-sm font-medium leading-relaxed">
                    개인 가계부, 자산, 모임 통장을<br>한곳에서
                </p>
            </div>

            <!-- 초대 코드 입력 영역 -->
            <div class="space-y-3 mb-6">
                <input 
                    type="text" 
                    id="inviteCodeInput"
                    placeholder="초대 코드 입력" 
                    class="w-full text-center px-4 py-3.5 bg-white border border-slate-200 rounded-2xl text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:border-indigo-600 transition shadow-sm"
                >
                <button 
                    id="enterCodeBtn" 
                    class="w-full bg-slate-900 text-white font-semibold py-3.5 px-4 rounded-2xl text-sm hover:bg-slate-800 active:scale-[0.99] transition shadow-sm"
                >
                    초대 코드로 대시보드 보기
                </button>
            </div>

            <!-- 구분선 -->
            <div class="relative flex items-center justify-center my-6">
                <div class="border-t border-slate-200 w-full"></div>
                <span class="bg-white px-3 text-xs text-slate-400 font-medium absolute">또는</span>
            </div>

            <!-- 구글 로그인 버튼 -->
            <button 
                id="loginBtn" 
                class="w-full bg-[#2563eb] text-white font-semibold py-3.5 px-4 rounded-2xl text-sm flex items-center justify-center space-x-2 hover:bg-blue-700 active:scale-[0.99] transition shadow-sm"
            >
                <!-- 구글 'G' 원형 아이콘 -->
                <span class="bg-white w-5 h-5 rounded-full flex items-center justify-center">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                </span>
                <span>Google로 계속하기</span>
            </button>

            <!-- 하단 안내 문구 -->
            <p class="text-xs text-slate-400 mt-6">
                초대 코드 입력 시 모임의 내역을 함께 볼 수 있어요
            </p>
        </div>

        <!-- 2. 구글 로그인 완료 시 임시 표시 화면 -->
        <div id="loggedInView" class="hidden">
            <img id="userAvatar" class="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-sky-600 shadow-sm" src="" alt="프로필">
            <h2 id="userName" class="text-xl font-bold text-slate-800 mb-1"></h2>
            <p id="userEmail" class="text-xs text-slate-500 mb-6"></p>
            <button id="logoutBtn" class="w-full bg-slate-100 text-slate-600 font-semibold py-2.5 px-4 rounded-xl hover:bg-slate-200 text-sm transition">
                로그아웃
            </button>
        </div>

    </div>

    <!-- 스크립트 연결 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
